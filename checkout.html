<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Checkout - ShopEase
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>


<header>

    <nav class="navbar">

        <a
            href="index.html"
            class="logo">

            ShopEase

        </a>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">

                Cart

                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </nav>

</header>


<section class="checkout-section">

    <div class="section-heading">

        <p>
            COMPLETE ORDER
        </p>

        <h1>
            Checkout
        </h1>

    </div>


    <div class="checkout-container">


        <form
            class="checkout-form"
            onsubmit="completePurchase(event)">


            <h2>
                Customer Details
            </h2>


            <label for="customer-name">
                Full Name
            </label>

            <input
                type="text"
                id="customer-name"
                placeholder="Enter your name"
                required>


            <label for="customer-email">
                Email
            </label>

            <input
                type="email"
                id="customer-email"
                placeholder="Enter your email"
                required>


            <label for="customer-phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="customer-phone"
                placeholder="Enter phone number"
                required>


            <label for="customer-address">
                Address
            </label>

            <textarea
                id="customer-address"
                placeholder="Enter your address"
                required></textarea>


            <label for="customer-city">
                City
            </label>

            <input
                type="text"
                id="customer-city"
                placeholder="Enter your city"
                required>


            <label for="payment-method">
                Payment Method
            </label>

            <select
                id="payment-method"
                required>

                <option value="">
                    Select Payment Method
                </option>

                <option value="Cash on Delivery">
                    Cash on Delivery
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Credit/Debit Card">
                    Credit/Debit Card
                </option>

            </select>


            <button
                type="submit"
                class="button">

                Place Order

            </button>


        </form>


        <div class="checkout-info">

            <h2>
                Secure Checkout
            </h2>

            <p>
                Your order information is
                processed securely.
            </p>

            <div class="checkout-note">

                🚚 Fast Delivery

            </div>

            <div class="checkout-note">

                🔒 Secure Shopping

            </div>

            <div class="checkout-note">

                💳 Multiple Payment Options

            </div>

        </div>


    </div>

</section>


<footer>

    <div class="copyright">

        © 2026 ShopEase.
        All Rights Reserved.

    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
