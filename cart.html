<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Cart - ShopEase
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>


<header>

    <nav class="navbar">

        <a
            href="index.html"
            class="logo">

            ShopEase

        </a>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">

                Cart

                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </nav>

</header>


<section class="cart-section">

    <div class="section-heading">

        <p>
            SHOPPING
        </p>

        <h1>
            Your Cart
        </h1>

    </div>


    <div
        id="cart-items"
        class="cart-items">

    </div>


    <div class="cart-summary">

        <div class="summary-row">

            <span>
                Subtotal
            </span>

            <strong id="cart-subtotal">
                ₹0
            </strong>

        </div>


        <div class="summary-row">

            <span>
                Delivery
            </span>

            <strong id="cart-delivery">
                ₹0
            </strong>

        </div>


        <div class="summary-row total-row">

            <span>
                Total
            </span>

            <strong id="cart-total">
                ₹0
            </strong>

        </div>


        <a
            href="checkout.html"
            class="button">

            Proceed to Checkout

        </a>

    </div>

</section>


<footer>

    <div class="copyright">

        © 2026 ShopEase.
        All Rights Reserved.

    </div>

</footer>


<script src="script.js"></script>

<script>

displayCart();

</script>

</body>
</html>
