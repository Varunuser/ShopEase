<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-STXT0ZD5DV"></script>

    <script>

        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-STXT0ZD5DV');

    </script>


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Checkout - ShopEase
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<header>

    <nav class="navbar">

        <a
            href="index.html"
            class="logo">

            ShopEase

        </a>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">

                Cart

                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </nav>

</header>


<section class="checkout-section">

    <div class="section-heading">

        <p>
            ORDER
        </p>

        <h1>
            Checkout
        </h1>

    </div>


    <form
        class="checkout-form"
        onsubmit="completePurchase(event)">


        <div class="form-group">

            <label for="customer-name">
                Full Name
            </label>

            <input
                type="text"
                id="customer-name"
                required>

        </div>


        <div class="form-group">

            <label for="customer-email">
                Email
            </label>

            <input
                type="email"
                id="customer-email"
                required>

        </div>


        <div class="form-group">

            <label for="customer-phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="customer-phone"
                required>

        </div>


        <div class="form-group">

            <label for="customer-address">
                Address
            </label>

            <textarea
                id="customer-address"
                rows="4"
                required>
            </textarea>

        </div>


        <div class="form-group">

            <label for="customer-city">
                City
            </label>

            <input
                type="text"
                id="customer-city"
                required>

        </div>


        <div class="form-group">

            <label for="payment-method">
                Payment Method
            </label>

            <select
                id="payment-method"
                required>

                <option value="">
                    Select Payment Method
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Credit Card">
                    Credit Card
                </option>

                <option value="Debit Card">
                    Debit Card
                </option>

                <option value="Cash on Delivery">
                    Cash on Delivery
                </option>

            </select>

        </div>


        <button
            type="submit"
            class="button">

            Place Order

        </button>


    </form>

</section>


<footer>

    <div class="copyright">

        © 2026 ShopEase. All Rights Reserved.

    </div>

</footer>


<script src="script.js"></script>


</body>

</html>
